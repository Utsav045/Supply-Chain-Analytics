[project]
name = "backend"
version = "0.1.0"
description = "Supply Chain Analytics Backend"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "sqlalchemy>=2.0",
    "pymysql>=1.1.0",
    "alembic>=1.11.0",
]
[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"
