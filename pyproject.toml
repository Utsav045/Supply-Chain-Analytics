[project]
name = "supply-chain-analytics"
version = "0.1.0"
description = "Demand Forecasting & Anomaly Detection Platform"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "sqlalchemy>=2.0",
    "pymysql>=1.1.0",
    "alembic>=1.11.0",
    "scikit-learn>=1.2.0",
    "statsmodels>=0.14.0",
    "prophet>=1.1.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "plotly>=5.15.0",
    "pytest>=7.3.0",
    "ruff>=0.0.270",
    "black>=23.3.0",
    "isort>=5.12.0",
    "mypy>=1.3.0",
    "nbstripout>=0.6.0",
]

[tool.ruff]
line-length = 88
src = ["backend", "src"]
exclude = [
    ".git",
    ".mypy_cache",
    ".pytest_cache",
    ".ruff_cache",
    ".venv",
    "node_modules",
    "frontend/node_modules",
]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "B"]
ignore = ["B008"]


[tool.black]
line-length = 88
target-version = ['py310']
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.pytest_cache
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  | node_modules
  | frontend/node_modules
)/
'''

[tool.isort]
profile = "black"
line_length = 88
known_first_party = ["app", "src"]
skip = [".venv", "node_modules", ".git", "frontend/node_modules"]

[tool.mypy]
mypy_path = ["backend", "src"]
explicit_package_bases = true

[tool.pyright]
extraPaths = ["backend", "src"]


