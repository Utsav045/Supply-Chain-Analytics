/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.pytest_cache
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  | node_modules
  | frontend/node_modules
)/
'''

[tool.isort]
profile = "black"
